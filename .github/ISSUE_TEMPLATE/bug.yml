name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for providing a minimal, privacy-safe reproduction.
  - type: input
    id: version
    attributes:
      label: PolyPlugin Forge version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Plugin target
      options:
        - MCP
        - VS Code
        - Chrome
        - Webhook
        - Cross-target
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include commands, sanitized inputs, and observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, and private source code.
          required: true
