apiVersion: polyplugin.dev/v1alpha1
kind: Plugin
metadata:
  id: "hello.vscode"
  name: "Hello VS Code"
  version: "0.1.0"
  description: "Registers a real VS Code greeting command."
  license: MIT
  package: "hello-vscode"
runtime:
  language: node
  node: ">=22.0.0"
  source: src
  entry: src/extension.js
target:
  type: vscode
  publisher: polyplugin
  engine: "^1.95.0"
capabilities:
  - id: hello-command
    type: vscode.command
    name: hello
    title: "Hello VS Code"
    description: "Registers a real VS Code greeting command."
    handler: src/extension.js
    permissions: []
    tests:
      - test/extension.test.js
    command: "hello.vscode"
permissions: []
dataFlows: []
privacy:
  notice: "This extension processes the command locally and does not collect, retain, or transmit user data."
  collectsPersonalData: false
  telemetry: false
compatibility:
  os:
    - linux
    - darwin
    - win32
  arch:
    - x64
    - arm64
  targetVersions:
    - "^1.95.0"
  features:
    - commands
tests:
  command:
    - npm
    - test
